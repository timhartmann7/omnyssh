[package]
name = "omnyssh-core"
version.workspace = true
edition.workspace = true
description = "SSH engine, configs, metrics, and updater powering OmnySSH frontends"
license.workspace = true
repository.workspace = true
keywords = ["ssh", "devops"]
categories = ["network-programming"]

[dependencies]
# `net`: the local listeners of port forwarding.
tokio = { workspace = true, features = ["net"] }
walkdir = "2"

# SSH
russh = "0.46"
russh-sftp = "2.0"
russh-keys = "0.46"
# The public half of an encrypted OpenSSH key, to match it with an agent key.
# Already built for russh-keys.
ssh-key = "0.6"

# Serialization
serde = { workspace = true }
toml = { workspace = true }

# Logging
tracing = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Required for implementing russh::client::Handler (uses #[async_trait])
async-trait = "0.1"
async-recursion = "1.1"
# Feature B: Auto SSH Key Setup — timestamp generation
chrono = { workspace = true }

# Cross-platform paths (P-CROSS-01)
dirs = { workspace = true }

# glob(7) patterns in ssh_config `Include` directives
glob = "0.3"

# Terminal emulator — vt100 screen model (PTY is provided by russh channels)
vt100 = { package = "vt100-omnyssh", version = "0.15" }

# Update checker — GitHub Releases query, archive extraction, self-replace
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
semver = "1"
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
self-replace = "1"

# The drive letters the local file panes can switch to. Already built for tokio.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
tempfile = "3"
