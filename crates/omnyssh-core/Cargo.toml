[package]
name = "omnyssh-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "SSH engine, configs, metrics, and updater powering OmnySSH frontends"
license.workspace = true
repository.workspace = true
keywords = ["ssh", "devops"]
categories = ["network-programming"]

[dependencies]
# `net`: the local listeners of port forwarding.
tokio = { workspace = true, features = ["net"] }

# SSH. The ring backend, not aws-lc-rs: aws-lc-sys needs cmake and NASM on
# Windows. flate2 keeps zlib compression.
russh = { version = "0.63.3", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "2.0"

# Serialization
serde = { workspace = true }
serde_json = "1"
toml = { workspace = true }
base64 = "0.22"

# Logging
tracing = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Async traits used as trait objects: password prompts, service providers
async-trait = "0.1"

# Feature B: Auto SSH Key Setup — timestamp generation
chrono = { workspace = true }

# Cross-platform paths (P-CROSS-01)
dirs = { workspace = true }

# glob(7) patterns in ssh_config `Include` directives
glob = "0.3"

# Terminal emulator — vt100 screen model (PTY is provided by russh channels)
vt100 = { package = "vt100-omnyssh", version = "0.15" }

# Update checker — GitHub Releases query, archive extraction, self-replace
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
semver = "1"
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
self-replace = "1"

# The drive letters the local file panes can switch to. Already built for tokio.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
tempfile = "3"
